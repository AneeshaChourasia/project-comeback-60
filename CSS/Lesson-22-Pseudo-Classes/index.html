<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 22 - CSS Pseudo Classes</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>CSS Pseudo Classes Practice</h1>

    <!-- ================= Hover & Active ================= -->

    <h2>:hover & :active</h2>

    <button type="button">Click Me</button>

    <hr />

    <!-- ================= Focus ================= -->

    <h2>:focus</h2>

    <label for="userName">User Name :</label>

    <input type="text" id="userName" placeholder="Enter your username" />

    <hr />

    <!-- ================= First Child / Last Child / nth Child ================= -->

    <h2>List Example</h2>

    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Git</li>
    </ul>

    <hr />

    <!-- ================= Checked ================= -->

    <h2>:checked</h2>

    <label>
      <input type="checkbox" />
      Accept Terms & Conditions
    </label>

    <hr />

    <!-- ================= Disabled & Enabled ================= -->

    <h2>Disabled / Enabled</h2>

    <input type="text" placeholder="Enabled Input" />

    <br /><br />

    <input type="text" placeholder="Disabled Input" disabled />

    <hr />

    <!-- ================= Link / Visited / Not ================= -->

    <h2>Navigation Example</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#" class="active">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </body>
</html>
